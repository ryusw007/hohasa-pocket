    const draw = () => {
      el.innerHTML = '<div class="row">'+cats.map(c=>'<button class="chip'+(c===cur?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'
        + list.filter(x=>cur==='전체'||x[key]===cur).map(render).join('') + (el.id==='p-prompts' ? shareBox() : '');
      el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ cur=b.dataset.c; draw(); });
      el.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copy(b));
    };
    draw();
  }
  chips(D.uses||[], 'tag', document.getElementById('p-uses'), u =>
    '<div class="item"><div class="t">'+esc(u.title)+'</div><div class="d">'+esc(u.body)+'</div>'
    + '<div class="meta"><span class="tag">'+esc(u.tag)+'</span><span class="who">'+esc(u.who)+'</span></div></div>');
  const P = D.prompts||[];
  chips(P, 'cat', document.getElementById('p-prompts'), p =>
    '<div class="item"><div class="t">'+esc(p.title)+'</div><pre class="p">'+esc(p.text)+'</pre>'
    + '<div class="meta"><button class="copy" data-i="'+P.indexOf(p)+'">복사하기</button><span class="tag">'+esc(p.cat)+'</span><span class="who">'+esc(p.by)+'</span></div></div>');
  function shareBox(){ return D.share_how ? '<div class="share">✍️ <b>내 프롬프트 공유하기</b><br>'+esc(D.share_how)+'</div>' : ''; }
  function copy(b){
    const t = P[+b.dataset.i].text;
    const done = () => { b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='복사하기',1500); };
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(()=>fallback(t,done)); else fallback(t,done);
  }
  function fallback(t,done){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); done(); }catch(_){} a.remove(); }

  const tabs = document.querySelectorAll('#tabs .pill');
  function show(t){ tabs.forEach(b=>b.classList.toggle('on', b.dataset.t===t));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+t)); }
  tabs.forEach(b=>b.onclick=()=>{ show(b.dataset.t); history.replaceState(null,'','#'+b.dataset.t); });
  if(location.hash) show(location.hash.slice(1));
  if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>

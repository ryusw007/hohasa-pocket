<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>서울시보 부동산 고시</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="호하사 데일리 다이제스트">
<meta property="og:title" content="서울시보 · 부동산 고시">
<meta property="og:description" content="재개발 · 정비사업 · 지구단위계획 등 서울특별시 고시를 호마다 정리">
<meta property="og:image" content="https://ryusw007.github.io/hohasa-pocket/issues/2026-10-02/og2.png?v=20261002">
<meta property="og:url" content="https://ryusw007.github.io/hohasa-pocket/sibo.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{ --accent:#f5701e; --bg:#0b0e14; --card:#161922; --line:#2c313d; --dim:#9a9da4; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:#e9eaee;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap{ max-width:720px; margin:0 auto; padding:20px 16px 60px; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .home{ display:inline-flex; align-items:center; gap:6px; color:#e9eaee; text-decoration:none;
    font-weight:800; font-size:14px; background:var(--card); padding:8px 12px; border-radius:20px; }
  .date{ color:var(--dim); font-weight:700; font-size:13px; }
  h1{ font-size:24px; margin:18px 0 4px; }
  h1 .b{ background:var(--accent); color:#fff; border-radius:8px; padding:0 8px; }
  .sub{ color:var(--dim); font-size:13px; line-height:1.5; }
  .row{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; margin-top:12px; scrollbar-width:none; }
  .row::-webkit-scrollbar{ display:none; }
  .pill{ flex:0 0 auto; background:var(--card); color:#c9ccd3; border:1px solid var(--line); border-radius:999px;
    padding:8px 13px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .pill.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .pill .n{ opacity:.75; font-weight:600; margin-left:4px; }
  .issue{ margin-top:14px; background:var(--card); border-radius:14px; padding:14px 16px; display:flex;
    align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .issue b{ font-size:16px; }
  .issue .m{ color:var(--dim); font-size:13px; margin-top:3px; }
  a.pdf{ color:var(--accent); font-weight:800; font-size:14px; text-decoration:none;
    border:1px solid var(--accent); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  .sec{ margin-top:22px; font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; }
  .sec::before{ content:""; width:4px; height:16px; background:var(--accent); border-radius:2px; }
  .item{ background:var(--card); border-radius:14px; padding:13px 15px; margin-top:10px; }
  .item .t{ font-weight:700; font-size:15px; line-height:1.5; word-break:keep-all; overflow-wrap:anywhere; }
  .tags{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .tag{ font-size:12px; font-weight:700; padding:3px 8px; border-radius:6px; background:#20242e; color:#c9ccd3; }
  .tag.st{ background:rgba(245,112,30,.16); color:#ffa56b; }
  .tag.gu{ background:#1d2a3a; color:#8ec5ff; }
  .pg{ margin-left:auto; color:var(--dim); font-size:12px; font-weight:700; }
  .empty{ color:var(--dim); padding:30px; text-align:center; }
  .note{ margin-top:28px; color:#6b6e76; font-size:12px; line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="home" href="index.html">← 홈</a>
      <span class="date" id="date"></span>
    </div>
    <h1>서울시보 <span class="b">부동산 고시</span></h1>
    <div class="sub">재개발 · 정비사업 · 모아타운 · 지구단위계획 등 서울특별시 고시를 호마다 정리합니다.</div>
    <div class="row" id="issues"></div>
    <div id="head"></div>
    <div class="row" id="filters"></div>
    <div id="body"><div class="empty">불러오는 중…</div></div>
    <div class="note">
      목록: 서울 열린데이터광장(OA-23063) · 항목: 시보 PDF 목차에서 자동 추출.<br>
      분류는 제목 키워드 기준이라 빠지거나 잘못 분류된 항목이 있을 수 있습니다. 투자 판단 전 반드시 원문을 확인하세요.<br>
      본 내용은 호하사 멤버 대상으로 제공되는 단순 정보입니다.
    </div>
  </div>
<script>
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  var D=null, cur=0, filt='dev';
  function dot(d){ return String(d||'').replace(/-/g,'.'); }

  function render(){
    var is = D.issues[cur], items = is.items||[];
    document.getElementById('issues').innerHTML = D.issues.map(function(x,i){
      var n=(x.items||[]).filter(function(it){return it.rel==='high';}).length;
      return '<button class="pill'+(i===cur?' on':'')+'" data-i="'+i+'">'+esc(x.no)+' · '+esc(dot(x.date).slice(5))+'<span class="n">'+n+'</span></button>';
    }).join('');
    var size = is.mb ? ' ('+is.mb+'MB)' : '';
    document.getElementById('head').innerHTML = '<div class="issue"><div><b>서울시보 '+esc(is.no)+'</b>'
      + '<div class="m">'+esc(dot(is.date))+' 발행 · 전체 '+items.length+'건'+(is.pages?' · '+is.pages+'쪽':'')+'</div></div>'
      + (/^https?:\/\//i.test(is.pdf||'') ? '<a class="pdf" href="'+esc(is.pdf)+'" target="_blank" rel="noopener">원문 PDF'+size+' ↗</a>' : '')
      + '</div>';

    // 필터: 개발 관련 / 분류별 / 전체
    var cats={}; items.forEach(function(it){ (it.cats||[]).forEach(function(c){ cats[c]=(cats[c]||0)+1; }); });
    var dev = items.filter(function(it){return it.rel==='high';}).length;
    var fs=[['dev','개발 관련',dev]].concat(Object.keys(cats).map(function(c){return ['c:'+c,c,cats[c]];})).concat([['all','전체',items.length]]);
    if(!fs.some(function(f){return f[0]===filt;})) filt='dev';
    document.getElementById('filters').innerHTML = fs.map(function(f){
      return '<button class="pill'+(f[0]===filt?' on':'')+'" data-f="'+esc(f[0])+'">'+esc(f[1])+'<span class="n">'+f[2]+'</span></button>';
    }).join('');

    var list = items.filter(function(it){
      if(filt==='all') return true;
      if(filt==='dev') return it.rel==='high';
      return (it.cats||[]).indexOf(filt.slice(2))>=0;
    });
    if(!list.length){ document.getElementById('body').innerHTML='<div class="empty">이 호에는 해당 항목이 없습니다.</div>'; return; }
    // 섹션(고시/공고/구고시…)별로 묶기
    var groups={}, order=[];
    list.forEach(function(it){ var s=it.section||'기타'; if(!groups[s]){groups[s]=[];order.push(s);} groups[s].push(it); });
    document.getElementById('body').innerHTML = order.map(function(s){
      return '<div class="sec">'+esc(s)+' <span style="color:#6b6e76;font-weight:700">'+groups[s].length+'</span></div>'
        + groups[s].map(function(it){
          var tags = (it.stage && it.stage!=='기타' ? '<span class="tag st">'+esc(it.stage)+'</span>' : '')
            + (it.gu ? '<span class="tag gu">'+esc(it.gu)+'</span>' : '')
            + (it.cats||[]).map(function(c){return '<span class="tag">'+esc(c)+'</span>';}).join('')
            + (it.page ? '<span class="pg">p.'+esc(it.page)+'</span>' : '');
          return '<div class="item"><div class="t">'+esc(it.title)+'</div>'+(tags?'<div class="tags">'+tags+'</div>':'')+'</div>';
        }).join('');
    }).join('');
  }

  document.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b||!D) return;
    if(b.dataset.i!=null){ cur=+b.dataset.i; filt='dev'; render(); window.scrollTo(0,0); }
    else if(b.dataset.f){ filt=b.dataset.f; render(); }
  });

  fetch('sibo/latest.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    D=d;
    if(!d.issues||!d.issues.length){ document.getElementById('body').innerHTML='<div class="empty">아직 수집된 시보가 없습니다.</div>'; return; }
    if(d.updated) document.getElementById('date').textContent = dot(String(d.updated).slice(0,10))+' 갱신';
    render();
  }).catch(function(){
    document.getElementById('body').innerHTML='<div class="empty">시보 목록을 불러올 수 없습니다. 잠시 후 다시 시도해주세요.</div>';
  });
</script>
</body>
</html>

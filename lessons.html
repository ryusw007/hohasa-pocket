<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>호하사 강의툰</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="호하사 강의툰">
<meta property="og:title" content="호하사 강의툰">
<meta property="og:description" content="호스텔·부동산 사업 강의를 웹툰북처럼 모아보는 교육 아카이브">
<meta property="og:image" content="https://ryusw007.github.io/hohasa-pocket/og.png">
<meta property="og:url" content="https://ryusw007.github.io/hohasa-pocket/lessons.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{ --accent:#2e9e6e; --bg:#0b0e14; --card:#161922; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:#e9eaee;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap{ max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  .top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:#c9ccd3; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .home{ color:#9a9da4; text-decoration:none; font-weight:700; font-size:13px; background:var(--card);
    padding:7px 12px; border-radius:20px; }
  .lead{ margin-top:18px; color:#c9ccd3; font-size:14px; line-height:1.6; }
  .total{ margin-top:20px; color:#8b8e96; font-size:12px; font-weight:700; }
  /* 썸네일 갤러리 — 휴대폰 2열 / 태블릿 3열 / PC 4열 */
  .grid{ margin-top:10px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 12px; }
  @media (min-width:600px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px 16px; } }
  @media (min-width:900px){ .grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .ep{ display:block; text-decoration:none; color:#e9eaee; min-width:0; }
  .ep .thumb{ position:relative; border-radius:14px; overflow:hidden; background:var(--card);
    box-shadow:0 8px 22px rgba(0,0,0,.4); transition:transform .15s; }
  .ep:active .thumb{ transform:scale(.97); }
  @media (hover:hover){ .ep:hover .thumb{ transform:translateY(-3px); } }
  .ep img{ width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:#0b0e14; }
  /* NEW 표시는 표지 그림(상단에 제목 글씨가 있음)을 가리지 않도록 날짜 줄에 둔다 */
  .ep .new{ display:inline-block; margin-left:6px; background:var(--accent); color:#fff; vertical-align:1px;
    font-size:10px; font-weight:800; padding:1px 6px; border-radius:8px; letter-spacing:.3px; }
  .ep .t{ margin-top:9px; font-weight:800; font-size:14px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:keep-all; }
  .ep .d{ margin-top:4px; color:#8b8e96; font-size:12px; font-weight:700; }
  .ep .d b{ color:var(--accent); font-weight:700; }
  .empty{ margin-top:40px; color:#9a9da4; text-align:center; padding:20px; }
  .foot{ margin-top:40px; text-align:center; color:#6b6e76; font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="dot"></span><span>호하사 강의툰</span></div>
      <a class="home" href="index.html">🏠 다이제스트</a>
    </div>
    <div class="lead">호스텔·부동산 사업의 실전 강의를 카드 교본으로 정리했습니다.<br>웹툰처럼 넘겨보며 필요할 때 다시 꺼내보세요.</div>
    <div class="total" id="total"></div>
    <div class="grid" id="grid"><div class="empty">불러오는 중…</div></div>
    <div class="foot">Hostel Up People · 강의툰 아카이브</div>
  </div>
<script>
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const lessons = [{"id": "lesson25", "title": "행복부자 강의툰 25화: 관광숙박업, OEM 제조업 겸업으로 벤처인증 받는 법", "date": "2026-09-23", "cover": "lessons/lesson25/00_cover.jpg", "count": 6}, {"id": "lesson24", "title": "공매 낙찰부터 만실까지 — 신도림 아늑호텔로 배우는 6단계", "date": "2026-09-22", "cover": "lessons/lesson24/00_cover.jpg", "count": 6}, {"id": "lesson23", "title": "호스텔 100개 늘었는데 왜 아직도 부족할까 — 숫자로 보는 진짜 수급", "date": "2026-09-21", "cover": "lessons/lesson23/00_cover.jpg", "count": 6}, {"id": "lesson22", "title": "성수동 지구단위계획, 권장업종이면 3중 인센티브", "date": "2026-09-20", "cover": "lessons/lesson22/00_cover.jpg", "count": 6}, {"id": "lesson21", "title": "가족법인, 나누면 정말 세금이 줄어들까?", "date": "2026-09-19", "cover": "lessons/lesson21/00_cover.jpg", "count": 6}, {"id": "lesson20", "title": "무인숙소, 게스트가 나갔는지 어떻게 알까?", "date": "2026-09-18", "cover": "lessons/lesson20/00_cover.jpg", "count": 6}, {"id": "lesson19", "title": "셀프빨래방, 숙소 사업자가 부업으로 해도 될까?", "date": "2026-09-17", "cover": "lessons/lesson19/00_cover.jpg", "count": 6}, {"id": "lesson18", "title": "스프링클러 의무화, 왜 지금 사업계획을 받아야 할까?", "date": "2026-09-16", "cover": "lessons/lesson18/00_cover.jpg", "count": 6}, {"id": "lesson17", "title": "지구단위계획구역, 심의 없이 몇 평까지 증축될까?", "date": "2026-09-15", "cover": "lessons/lesson17/00_cover.jpg", "count": 6}, {"id": "lesson16", "title": "성수동 준공업지역, 숙박시설 정말 안 될까?", "date": "2026-09-14", "cover": "lessons/lesson16/00_cover.jpg", "count": 6}, {"id": "lesson15", "title": "추인허가로 건물값 올리는 법", "date": "2026-09-13", "cover": "lessons/lesson15/00_cover.jpg", "count": 6}, {"id": "lesson14", "title": "에어비앤비 무단침입, 남 일이 아닙니다", "date": "2026-09-12", "cover": "lessons/lesson14/00_cover.jpg", "count": 6}, {"id": "lesson13", "title": "호스텔 택스리펀, 도입 전에 꼭 확인하세요", "date": "2026-09-11", "cover": "lessons/lesson13/00_cover.jpg", "count": 6}, {"id": "lesson12", "title": "실내흡연 손님, 이렇게 대응하세요", "date": "2026-09-10", "cover": "lessons/lesson12/00_cover.jpg", "count": 7}, {"id": "lesson11", "title": "호스텔 사업계획서, 잔고증명서는 얼마나 필요할까?", "date": "2026-09-09", "cover": "lessons/lesson11/00_cover.jpg", "count": 6}, {"id": "lesson10", "title": "에어비앤비 계정, 왜 이렇게 까다롭게 나눠야 할까?", "date": "2026-09-08", "cover": "lessons/lesson10/00_cover.jpg", "count": 6}, {"id": "lesson09", "title": "고시원 매입, '방공제'가 대출을 갉아먹는다", "date": "2026-09-07", "cover": "lessons/lesson09/00_cover.jpg", "count": 6}, {"id": "lesson08", "title": "샤워실·화장실, 따로 나눠야 할까?", "date": "2026-09-05", "cover": "lessons/lesson08/00_cover.jpg", "count": 6}, {"id": "lesson07", "title": "평당 공사견적, 어디까지가 '평'일까?", "date": "2026-09-04", "cover": "lessons/lesson07/00_cover.jpg", "count": 6}, {"id": "lesson06", "title": "조합 없이, 더 넓게, 더 높게 — '민도복' 3대 차이", "date": "2026-09-03", "cover": "lessons/lesson06/00_cover.jpg", "count": 6}, {"id": "lesson04", "title": "물은 낮은 곳으로, 그리고 내 건물로", "date": "2026-09-02", "cover": "lessons/lesson04/00_cover.jpg", "count": 6}, {"id": "lesson01", "title": "이 빠진 땅이 만든 협상의 기술", "date": "2026-09-01", "cover": "lessons/lesson01/00_cover.jpg", "count": 6}, {"id": "lesson02", "title": "북도로 하나로 건물 가치가 갈린다", "date": "2026-09-01", "cover": "lessons/lesson02/00_cover.jpg", "count": 6}, {"id": "lesson03", "title": "그냥 시장님의 뜻입니다", "date": "2026-09-01", "cover": "lessons/lesson03/00_cover.jpg", "count": 6}];   // 빌드 시 주입 — newest first
  (function(){
    const grid = document.getElementById('grid');
    if(!lessons || !lessons.length){
      grid.innerHTML = '<div class="empty">아직 등록된 강의툰이 없습니다.</div>'; return; }
    const newest = lessons[0].date;   // 최신 날짜에 올라온 편에 NEW 표시
    document.getElementById('total').textContent = '전체 '+lessons.length+'편';
    grid.innerHTML = lessons.map(it =>
      '<a class="ep" href="lesson_viewer.html?id='+encodeURIComponent(it.id)+'">'
      + '<div class="thumb"><img src="'+esc(it.cover)+'" alt="'+esc(it.title||it.id)+'" loading="lazy">'
      + '</div>'
      + '<div class="t">'+esc(it.title||it.id)+'</div>'
      + '<div class="d">'+(it.date||'').slice(5).replace('-','.')+' · <b>'+(it.count||0)+'p</b>'
      + (it.date===newest ? '<span class="new">NEW</span>' : '') + '</div>'
      + '</a>').join('');
  })();
  if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>호하사 데일리 다이제스트</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="호하사 데일리 다이제스트">
<meta property="og:title" content="호하사 데일리 다이제스트">
<meta property="og:description" content="오늘의 카툰 다이제스트 · 웹툰처럼 좌우로 넘겨 보세요">
<meta property="og:image" content="https://ryusw007.github.io/hohasa-pocket/og.png">
<meta property="og:url" content="https://ryusw007.github.io/hohasa-pocket/">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="호하사 다이제스트">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{ --accent:#f5701e; --bg:#0b0e14; --card:#161922; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:#e9eaee;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap{ max-width:720px; margin:0 auto; padding:24px 18px 60px; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:#c9ccd3; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .hero{ margin-top:16px; border-radius:20px; overflow:hidden; background:var(--card);
    box-shadow:0 16px 44px rgba(0,0,0,.5); }
  .hero img{ width:100%; display:block; }
  .hero .body{ padding:20px 20px 22px; }
  .hero h1{ margin:0 0 6px; font-size:24px; }
  .hero .d{ color:#9a9da4; font-weight:700; font-size:14px; margin-bottom:16px; }
  .btn{ display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none;
    font-weight:800; font-size:18px; padding:16px; border-radius:14px; }
  .btn2{ display:block; text-align:center; background:#20242e; color:#e9eaee; text-decoration:none;
    font-weight:800; font-size:16px; padding:14px; border-radius:14px; margin-top:10px; border:1px solid #2c313d; }
  .sec{ margin-top:34px; font-weight:800; font-size:15px; color:#c9ccd3; display:flex; align-items:center; gap:8px; }
  .sec::before{ content:""; width:4px; height:16px; background:var(--accent); border-radius:2px; }
  /* 가로 스크롤 회차 스트립 */
  .strip{ margin-top:14px; display:flex; gap:12px; overflow-x:auto; padding:4px 2px 14px;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .strip::-webkit-scrollbar{ height:6px; }
  .strip::-webkit-scrollbar-thumb{ background:#2a2e38; border-radius:3px; }
  .chip{ flex:0 0 auto; width:118px; scroll-snap-align:center; text-decoration:none; color:#e9eaee;
    background:var(--card); border-radius:14px; overflow:hidden; border:2px solid transparent; transition:transform .15s; }
  .chip:active{ transform:scale(.96); }
  .chip.today{ border-color:var(--accent); box-shadow:0 6px 18px rgba(245,112,30,.28); }
  .chip img{ width:118px; height:148px; object-fit:cover; display:block; background:#0b0e14; }
  .chip .d{ font-size:12px; font-weight:700; text-align:center; padding:8px 4px; color:#c9ccd3; }
  .chip.today .d{ color:var(--accent); }
  .hint{ margin-top:2px; color:#6b6e76; font-size:12px; }
  .empty{ color:#9a9da4; padding:20px; text-align:center; }
  .foot{ margin-top:40px; text-align:center; color:#6b6e76; font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span>호하사 데일리 다이제스트</span></div>
    <div id="hero"></div>
    <div class="sec">회차 넘겨보기</div>
    <div class="hint">← 좌우로 밀어 지난 회차를 보세요</div>
    <div class="strip" id="strip"><div class="empty">불러오는 중…</div></div>
    <div class="foot">웹툰처럼 좌우로 넘겨 보세요 · Hostel Up People</div>
  </div>
<script>
  function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  const issues = [{"date": "2026-09-02", "title": "AI가 만든 공식 일정 · 충무로 임대료 싯가 폭등", "cover": "issues/2026-09-02/00_cover.jpg", "count": 11}, {"date": "2026-09-01", "title": "동대문 밤의 반전 · 까대기 리워드 대소동", "cover": "issues/2026-09-01/00_cover.jpg", "count": 11}, {"date": "2026-08-31", "title": "불가리 8만원 사건 · 잔금 삼관왕의 날", "cover": "issues/2026-08-31/00_cover.jpg", "count": 11}, {"date": "2026-08-30", "title": "갭 5천 → 2억 무용담 · 살생부 대학살", "cover": "issues/2026-08-30/00_cover.jpg", "count": 11}, {"date": "2026-08-29", "title": "빈대 컴플레인 승리 · 평양냉면 대전쟁", "cover": "issues/2026-08-29/00_cover.jpg", "count": 11}, {"date": "2026-08-28", "title": "도어락 대참사 · 영림 쇼룸챗 G20급 환대", "cover": "issues/2026-08-28/00_cover.jpg", "count": 11}, {"date": "2026-08-27", "title": "리치 손구락 신공 · 호하사 베이비 러시", "cover": "issues/2026-08-27/00_cover.jpg", "count": 18}, {"date": "2026-08-26", "title": "AI 벌레 사기극 · 복도 벽과 한 판", "cover": "issues/2026-08-26/00_cover.jpg", "count": 13}, {"date": "2026-08-25", "title": "서울관광 데이터 · 누수와의 전쟁", "cover": "issues/2026-08-25/00_cover.jpg", "count": 11}, {"date": "2026-08-24", "title": "트립닷컴 세미나 · 청소 잔혹사", "cover": "issues/2026-08-24/00_cover.jpg", "count": 10}, {"date": "2026-08-23", "title": "골드만삭스 명동 · 코리빙 전략", "cover": "issues/2026-08-23/00_cover.jpg", "count": 10}, {"date": "2026-08-22", "title": "외국인 변튀 사건 · 리파이낸싱", "cover": "issues/2026-08-22/00_cover.jpg", "count": 10}, {"date": "2026-08-21", "title": "협회 발족 · 벤처인증", "cover": "issues/2026-08-21/00_cover.jpg", "count": 9}];   // 빌드 시 주입(런타임 fetch 불필요) — newest first
  (function(){
    if(!issues || !issues.length){
      document.getElementById('strip').innerHTML='<div class="empty">아직 발행된 회차가 없습니다.</div>'; return; }
    const latest = issues[0];
    document.getElementById('hero').innerHTML =
      '<div class="hero">'
      + '<img src="'+latest.cover+'" alt="">'
      + '<div class="body"><h1>'+esc(latest.title||'오늘의 카툰 다이제스트')+'</h1>'
      + '<div class="d">'+latest.date.replace(/-/g,".")+'</div>'
      + '<a class="btn" href="viewer.html?d='+latest.date+'">📖 오늘의 다이제스트 보기</a>'
      + '<a class="btn2" href="news.html">📰 오늘의 뉴스 브리핑</a>'
      + '<a class="btn2" href="lessons.html">📚 강의툰 보기</a></div></div>';

    // 가로 스트립: 과거→오늘(오름차순), 오늘 강조 + 가운데 정렬
    const asc = [...issues].reverse();
    const strip = document.getElementById('strip');
    strip.innerHTML = asc.map(it =>
      '<a class="chip'+(it.date===latest.date?' today':'')+'" href="viewer.html?d='+it.date+'">'
      + '<img src="'+it.cover+'" alt="" loading="lazy">'
      + '<div class="d">'+it.date.slice(5).replace('-','/')+'</div></a>').join('');
    const cur = strip.querySelector('.chip.today');
    if (cur) cur.scrollIntoView({inline:'center', block:'nearest'});
  })();
  if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>호하사 데일리 다이제스트</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="호하사 데일리 다이제스트">
<meta property="og:title" content="호하사 데일리 다이제스트">
<meta property="og:description" content="오늘의 카툰 다이제스트 · 웹툰처럼 좌우로 넘겨 보세요">
<meta property="og:image" content="https://ryusw007.github.io/hohasa-pocket/og.png">
<meta property="og:url" content="https://ryusw007.github.io/hohasa-pocket/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{ --accent:#f5701e; --bg:#0b0e14; --card:#161922; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:#e9eaee;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap{ max-width:720px; margin:0 auto; padding:24px 18px 60px; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:#c9ccd3; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .hero{ margin-top:16px; border-radius:20px; overflow:hidden; background:var(--card);
    box-shadow:0 16px 44px rgba(0,0,0,.5); }
  .hero img{ width:100%; display:block; }
  .hero .body{ padding:20px 20px 22px; }
  .hero h1{ margin:0 0 6px; font-size:24px; }
  .hero .d{ color:#9a9da4; font-weight:700; font-size:14px; margin-bottom:16px; }
  .btn{ display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none;
    font-weight:800; font-size:18px; padding:16px; border-radius:14px; }
  .sec{ margin-top:34px; font-weight:800; font-size:15px; color:#c9ccd3; display:flex; align-items:center; gap:8px; }
  .sec::before{ content:""; width:4px; height:16px; background:var(--accent); border-radius:2px; }
  .list{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .item{ display:flex; align-items:center; gap:14px; background:var(--card); border-radius:14px;
    padding:12px 14px; text-decoration:none; color:#e9eaee; }
  .item img{ width:52px; height:69px; object-fit:cover; border-radius:8px; background:#0b0e14; flex:none; }
  .item .t{ font-weight:700; font-size:15px; } .item .s{ color:#9a9da4; font-size:13px; margin-top:2px; }
  .item .go{ margin-left:auto; color:#6b6e76; font-size:20px; }
  .empty{ color:#9a9da4; padding:20px; text-align:center; }
  .foot{ margin-top:40px; text-align:center; color:#6b6e76; font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span>호하사 데일리 다이제스트</span></div>
    <div id="hero"></div>
    <div class="sec">지난 회차</div>
    <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
    <div class="foot">웹툰처럼 좌우로 넘겨 보세요 · Hostel Up People</div>
  </div>
<script>
  function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  const issues = [{"date": "2026-08-22", "title": "외국인 변튀 사건 · 리파이낸싱", "cover": "issues/2026-08-22/00_cover.jpg", "count": 10}, {"date": "2026-08-21", "title": "협회 발족 · 벤처인증", "cover": "issues/2026-08-21/00_cover.jpg", "count": 9}];   // 빌드 시 주입(런타임 fetch 불필요)
  (function(){
    if(!issues || !issues.length){ document.getElementById('list').innerHTML='<div class="empty">아직 발행된 회차가 없습니다.</div>'; return; }
    const latest=issues[0];
    document.getElementById('hero').innerHTML =
      '<div class="hero">'
      + '<img src="'+latest.cover+'" alt="">'
      + '<div class="body"><h1>'+esc(latest.title||'오늘의 카툰 다이제스트')+'</h1>'
      + '<div class="d">'+latest.date.replace(/-/g,".")+'</div>'
      + '<a class="btn" href="viewer.html?d='+latest.date+'">📖 오늘의 다이제스트 보기</a></div></div>';
    const rest=issues.slice(1);
    document.getElementById('list').innerHTML = rest.length ? rest.map(it=>
      '<a class="item" href="viewer.html?d='+it.date+'">'
      + '<img src="'+it.cover+'" alt="">'
      + '<div><div class="t">'+esc(it.title||'카툰 다이제스트')+'</div>'
      + '<div class="s">'+it.date.replace(/-/g,".")+'</div></div>'
      + '<div class="go">›</div></a>').join('') : '<div class="empty">지난 회차가 곧 쌓입니다.</div>';
  })();
</script>
</body>
</html>
